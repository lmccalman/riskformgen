- id: sedentary_risk
  description: Risk of an overly sedentary lifestyle based on activity patterns.
  conditions:
  - properties:
    - indoor_sedentary
    mode: all
    likelihood: likely
    consequence: medium
  - properties:
    - physically_active
    mode: all
    likelihood: unlikely
    consequence: minor
  - properties:
    - exercises_frequently
    mode: all
    likelihood: rare
    consequence: minor
- id: burnout_risk
  description: Risk of burnout from an indoor-heavy, solitary lifestyle.
  conditions:
  - properties:
    - indoor_sedentary
    mode: all
    likelihood: possible
    consequence: medium
  - properties:
    - outdoors_oriented
    mode: all
    likelihood: unlikely
    consequence: minor
  - properties:
    - socially_connected
    mode: all
    likelihood: unlikely
    consequence: minor
- id: isolation_risk
  description: Risk of social isolation based on social connections.
  conditions:
  - properties:
    - socially_connected
    mode: all
    likelihood: unlikely
    consequence: minor
  - properties:
    - group_participant
    mode: all
    likelihood: rare
    consequence: minor
  - properties:
    - indoor_sedentary
    mode: all
    likelihood: likely
    consequence: major
  - properties:
    - team_sport_player
    mode: all
    likelihood: rare
    consequence: minor
