- id: sedentary_risk
  description: Risk of an overly sedentary lifestyle based on activity patterns.
  conditions:
  - property: indoor_sedentary
    likelihood: likely
    consequence: medium
  - property: physically_active
    likelihood: unlikely
    consequence: minor
  - property: exercises_frequently
    likelihood: rare
    consequence: minor
- id: burnout_risk
  description: Risk of burnout from an indoor-heavy, solitary lifestyle.
  conditions:
  - property: indoor_sedentary
    likelihood: possible
    consequence: medium
  - property: outdoors_oriented
    likelihood: unlikely
    consequence: minor
  - property: socially_connected
    likelihood: unlikely
    consequence: minor
- id: isolation_risk
  description: Risk of social isolation based on social connections.
  conditions:
  - property: socially_connected
    likelihood: unlikely
    consequence: minor
  - property: group_participant
    likelihood: rare
    consequence: minor
  - property: indoor_sedentary
    likelihood: likely
    consequence: major
  - property: team_sport_player
    likelihood: rare
    consequence: minor
