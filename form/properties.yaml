# properties.yaml — Boolean properties forming a DAG.
#
# A property that holds implies all its parents also hold.
# Edges point child → parent.

- id: physically_active
  description: The person engages in regular physical activity.

- id: exercises_frequently
  description: The person exercises at least a few times per week.
  parents: [physically_active]

- id: outdoors_oriented
  description: The person spends meaningful time outdoors.

- id: socially_connected
  description: The person has regular social interaction.

- id: group_participant
  description: The person participates in organised group activities.
  parents: [socially_connected]

- id: team_sport_player
  description: The person plays team sports.
  parents: [group_participant, physically_active]

- id: indoor_sedentary
  description: The person's leisure time is predominantly indoor and sedentary.
