# controls.yaml — Safeguards that reduce assessed risk when present.
#
# Each control is linked to a property. It is "present" when the property
# evaluates to true at runtime.
#
# Effects list which risks are reduced, and in which dimension:
#   reduces_likelihood:  true — drops likelihood by one step on the scale
#   reduces_consequence: true — drops consequence by one step on the scale
# At least one of these must be true per effect.

- id: outdoor_access
  description: Access to outdoor spaces
  property: outdoors_oriented
  effects:
    - risk_id: burnout_risk
      reduces_consequence: true
    - risk_id: sedentary_risk
      reduces_likelihood: true

- id: regular_exercise
  description: Regular exercise programme
  property: exercises_frequently
  effects:
    - risk_id: sedentary_risk
      reduces_likelihood: true
      reduces_consequence: true
    - risk_id: burnout_risk
      reduces_likelihood: true

- id: group_participation
  description: Group activity participation
  property: group_participant
  effects:
    - risk_id: isolation_risk
      reduces_likelihood: true
    - risk_id: burnout_risk
      reduces_consequence: true

- id: team_sports
  description: Team sport involvement
  property: team_sport_player
  effects:
    - risk_id: isolation_risk
      reduces_likelihood: true
    - risk_id: sedentary_risk
      reduces_likelihood: true
